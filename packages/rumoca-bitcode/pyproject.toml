[project]
name = "rumoca-bitcode"
version = "0.2.0"
description = "Read, analyse and transform Rumoca Bitcode (.rbc) compiled Modelica models"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Faster CBOR. The SDK works without it: a pure-Python decoder ships in the
# package so reading a .rbc needs nothing but the standard library.
fast = ["cbor2>=5.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rumoca_bitcode*"]
